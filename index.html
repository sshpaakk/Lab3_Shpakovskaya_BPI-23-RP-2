<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Доска публикаций</title>

    <!-- Подключаем CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем шрифт Montserrat из Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <!-- Шапка страницы -->
        <header>
            <h1>Доска публикаций</h1>
            <p>Просматривайте публикации и создавайте новые</p>
        </header>

        <!-- Основная область с двумя колонками -->
        <main class="content">

            <!-- Левая колонка -->
            <section class="posts-section">

                <div class="section-header">
                    <h2>Публикации</h2>

                    <button id="loadButton">
                        Загрузить публикации
                    </button>
                </div>

                <!-- Список публикаций -->
                <div id="posts"></div>

            </section>

            <!-- Правая колонка -->
            <section class="create-section">

                <h2>Создать публикацию</h2>

                <!-- Форма -->
                <form id="postForm">

                    <label for="title">Заголовок</label>
                    <input
                        type="text"
                        id="title"
                        placeholder="Введите заголовок"
                    >

                    <label for="body">Текст</label>
                    <textarea
                        id="body"
                        placeholder="Введите текст публикации"
                    ></textarea>

                    <button type="submit" id="createButton">
                        Создать публикацию
                    </button>

                </form>

                <!-- Сообщения об успехе и ошибках -->
                <p id="message" role="status" aria-live="polite"></p>

            </section>

        </main>

    </div>

    <!-- Подключаем JavaScript -->
    <script src="app.js"></script>

</body>
</html>
